# ============================================================
# Group config — EDIT ME (one per group). Values here override
# the track defaults loaded from `track_config`.
# ============================================================
group_id: G08 # e.g. G07
owner: "Võ Nguyễn Thành Phát" # mandatory for every Decision
track_config: tracks/t12.yaml # pick your challenge: tracks/t01.yaml ... tracks/t14.yaml
track: t12 # must match track_config
input: fixtures/t12_vendor_batches # or data/real/... if your instructor provided a real pack
output: out/t12/poc
seed: 42
offline: true # demo/eval must not touch the network
strict_provenance: true # fail if manifest.csv hashes do not match

# Track params (merged over track_config.params). Freeze before evaluation.
params:
  pipeline_t12_sampling: stratified
  n_high: 10
  high_frac: 0.30
  accept_alpha: 0.05
